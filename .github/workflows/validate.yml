name: Validate data

on:
  pull_request:
    paths: ["data/**", "scripts/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate YAML and render
        run: python scripts/build.py   # fails on any schema/date error
